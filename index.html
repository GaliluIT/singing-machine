<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Singing Machine – TF.js Classifier + Synth + Multimodel</title>
  <style>
    #controls { margin-top: 10px; }
    button, select, label, input[type=checkbox], input[type=text] {
      padding: 10px;
      margin-right: 10px;
      font-size: 16px;
    }
    #rawDataOutput {
      margin-top: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      background: #f0f0f0;
      padding: 10px;
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
  <!-- JSZip for model import/export -->
 
</head>
<body>
  <h1>Singing Machine – TF.js Classifier + Synth + Multimodel</h1>
  <video id="webcam" autoplay playsinline width="640" height="480"></video>
  <canvas id="output" width="640" height="480"></canvas>

  <div id="controls">
    <label for="userID">Username:</label>
    <input type="text" id="userID" placeholder="e.g., user123" />

    <label for="language">Language:</label>
    <select id="language">
      <option value="ES">Spanish</option>
      <option value="EN">English</option>
    </select>

    <label for="intendedVowel">Label:</label>
    <select id="intendedVowel">
      <option value="A">A</option>
      <option value="E">E</option>
      <option value="I">I</option>
      <option value="O">O</option>
      <option value="U">U</option>
    </select>

    <button id="addExample">Add Example</button>
    <button id="trainModel">Train Model</button>
    <button id="predict">Predict</button>
    <button id="saveModel">Save Model</button>
    <button id="loadModel">Load Model</button>
    <button id="exportModel">Export Model</button>
    <button id="listModels">List Saved Models</button>
    <input type="file" id="importModel" accept=".zip" style="margin-top: 10px;" />
    <label><input type="checkbox" id="enableSound"> Enable Synthesis</label>
    <span id="prediction" style="font-size: 20px; font-weight: bold;"></span>
  </div>


<div id="rawDataOutput"></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
